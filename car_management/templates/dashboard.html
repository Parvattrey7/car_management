<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoManage Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen relative">
    <nav class="bg-slate-900/95 backdrop-blur-sm border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 p-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 tracking-tight">
                AutoManage<span class="font-light text-white">Pro</span>
            </h1>
            <div class="space-x-1">
                <a href="/" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition">Search</a>
                <a href="/add" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition">Add Car</a>
                <a href="/dashboard" class="px-4 py-2 bg-indigo-600/20 text-indigo-400 rounded-lg font-semibold transition">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-8 p-4">
        <h2 class="text-xl font-bold text-slate-800 mb-6">Fleet Overview</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-gradient-to-br from-indigo-500 to-indigo-700 p-6 rounded-2xl shadow-lg shadow-indigo-200 text-white relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                <h3 class="text-indigo-100 text-sm font-semibold uppercase tracking-wider mb-1">Total Vehicles</h3>
                <p id="totalCars" class="text-4xl font-extrabold">0</p>
            </div>
            
            <div class="bg-gradient-to-br from-emerald-400 to-emerald-600 p-6 rounded-2xl shadow-lg shadow-emerald-200 text-white relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                <h3 class="text-emerald-100 text-sm font-semibold uppercase tracking-wider mb-1">Total Inventory Value</h3>
                <p id="totalValue" class="text-4xl font-extrabold">₹0</p>
            </div>
            
            <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-2xl shadow-lg shadow-slate-200 text-white relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                <h3 class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-1">Average Price</h3>
                <p id="avgPrice" class="text-4xl font-extrabold">₹0</p>
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="p-5 font-semibold">ID</th>
                            <th class="p-5 font-semibold">Make</th>
                            <th class="p-5 font-semibold">Model</th>
                            <th class="p-5 font-semibold">Year</th>
                            <th class="p-5 font-semibold">Color</th>
                            <th class="p-5 font-semibold text-right">Price</th>
                            <th class="p-5 font-semibold text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-slate-700 text-sm divide-y divide-slate-100">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Modal (Hidden by Default) -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-200">
            <h2 class="text-2xl font-bold mb-6 text-slate-900">Edit Vehicle Info</h2>
            <form id="editCarForm" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Make</label>
                        <input type="text" id="edit-make" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Model</label>
                        <input type="text" id="edit-model" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Year</label>
                        <input type="number" id="edit-year" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Color</label>
                        <input type="text" id="edit-color" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Price (₹)</label>
                    <input type="number" id="edit-price" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                </div>
                
                <div class="flex gap-4 mt-8 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-200 transition">Cancel</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Load initial data
        async function loadDashboard() {
            const res = await fetch('/api/cars');
            const data = await res.json();
            const cars = data.cars;

            // Analytics logic
            const totalCars = cars.length;
            const totalValue = cars.reduce((sum, car) => sum + car.price, 0);
            const avgPrice = totalCars > 0 ? (totalValue / totalCars) : 0;

            document.getElementById('totalCars').innerText = totalCars;
            document.getElementById('totalValue').innerText = '₹' + totalValue.toLocaleString('en-IN');
            document.getElementById('avgPrice').innerText = '₹' + avgPrice.toLocaleString('en-IN', {maximumFractionDigits: 0});

            // Table rendering
            const tbody = document.getElementById('tableBody');
            if (cars.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">No vehicles in inventory.</td></tr>`;
                return;
            }

            tbody.innerHTML = ''; // clear table
            cars.forEach(car => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="p-5 text-slate-400 font-medium">#${car.id}</td>
                        <td class="p-5 font-bold text-slate-900">${car.make}</td>
                        <td class="p-5 text-slate-600">${car.model}</td>
                        <td class="p-5 text-slate-500">${car.year}</td>
                        <td class="p-5">
                            <span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md text-xs font-semibold uppercase tracking-wide border border-slate-200">
                                ${car.color}
                            </span>
                        </td>
                        <td class="p-5 font-bold text-slate-900 text-right group-hover:text-indigo-600 transition-colors">
                            ₹${car.price.toLocaleString('en-IN')}
                        </td>
                        <td class="p-5 text-center space-x-3">
                            <button onclick="openEditModal(${car.id}, \`${car.make}\`, \`${car.model}\`, ${car.year}, ${car.price}, \`${car.color}\`)" class="text-indigo-500 hover:text-indigo-700 font-semibold text-sm transition">Edit</button>
                            <button onclick="deleteCar(${car.id})" class="text-red-500 hover:text-red-700 font-semibold text-sm transition">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Delete Function
        async function deleteCar(id) {
            if(confirm("Are you sure you want to permanently delete this vehicle?")) {
                await fetch(`/api/cars/${id}`, { method: 'DELETE' });
                loadDashboard();
            }
        }

        // Modal Functions
        function openEditModal(id, make, model, year, price, color) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-make').value = make;
            document.getElementById('edit-model').value = model;
            document.getElementById('edit-year').value = year;
            document.getElementById('edit-price').value = price;
            document.getElementById('edit-color').value = color;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Submit Edit Form
        document.getElementById('editCarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const carData = {
                make: document.getElementById('edit-make').value,
                model: document.getElementById('edit-model').value,
                year: parseInt(document.getElementById('edit-year').value),
                price: parseFloat(document.getElementById('edit-price').value),
                color: document.getElementById('edit-color').value
            };

            await fetch(`/api/cars/edit/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(carData)
            });
            
            closeModal();
            loadDashboard(); // Refresh table
        });

        // Initialize dashboard
        loadDashboard();
    </script>
</body>
</html>
