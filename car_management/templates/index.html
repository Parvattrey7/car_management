<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoManage Pro | Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen selection:bg-indigo-500 selection:text-white">
    <nav class="bg-slate-900/95 backdrop-blur-sm border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 p-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 tracking-tight">
                AutoManage<span class="font-light text-white">Pro</span>
            </h1>
            <div class="space-x-1">
                <a href="/" class="px-4 py-2 bg-indigo-600/20 text-indigo-400 rounded-lg font-semibold transition">Search</a>
                <a href="/add" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition">Add Car</a>
                <a href="/dashboard" class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-12 p-4">
        <div class="flex justify-center mb-12">
            <div class="relative w-full max-w-3xl shadow-xl shadow-indigo-100 rounded-full flex bg-white p-1 border border-slate-200">
                <!-- Filter Dropdown -->
                <select id="sortFilter" onchange="fetchCars()" class="pl-6 pr-2 py-4 bg-transparent border-r border-slate-200 focus:outline-none text-slate-600 font-semibold cursor-pointer rounded-l-full">
                    <option value="id_desc">Latest Added</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="year_desc">Newest Models</option>
                </select>
                <!-- Search Input -->
                <input type="text" id="searchInput" placeholder="Search by Make, Model, or Color..." 
                       class="w-full pl-6 pr-4 py-4 bg-transparent focus:outline-none text-slate-700 text-lg placeholder-slate-400">
                <button onclick="fetchCars()" class="bg-slate-900 text-white px-8 py-4 rounded-full font-semibold hover:bg-indigo-600 transition-colors shadow-md">
                    Search
                </button>
            </div>
        </div>

        <div id="carGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Car cards injected via JS -->
        </div>
    </div>

    <script>
        async function fetchCars() {
            const query = document.getElementById('searchInput').value;
            const sort = document.getElementById('sortFilter').value;
            const res = await fetch(`/api/cars?q=${query}&sort=${sort}`);
            const data = await res.json();
            
            const grid = document.getElementById('carGrid');
            grid.innerHTML = '';

            if (data.cars.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-12 text-lg">No vehicles found.</div>`;
                return;
            }

            data.cars.forEach(car => {
                const safeColor = car.color.replace(/[^a-zA-Z0-9]/g, '');
                grid.innerHTML += `
                    <div class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-300 border border-slate-100 hover:-translate-y-2">
                        <div class="h-32 bg-gradient-to-br from-slate-800 to-slate-900 relative flex items-center justify-center overflow-hidden">
                            <div class="absolute inset-0 bg-indigo-500/20 group-hover:bg-indigo-500/40 transition-colors"></div>
                            <span class="text-slate-500 font-bold text-3xl tracking-widest uppercase z-10 group-hover:scale-110 transition-transform">${car.make}</span>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="text-2xl font-bold text-slate-800">${car.make} <span class="font-light">${car.model}</span></h2>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-6">
                                <span class="px-3 py-1 bg-indigo-50 text-indigo-700 rounded-full text-xs font-bold uppercase tracking-wider">${car.year}</span>
                                <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-semibold flex items-center gap-1.5 uppercase">
                                    <span class="w-2.5 h-2.5 rounded-full shadow-sm border border-slate-200" style="background-color: ${safeColor}"></span>
                                    ${car.color}
                                </span>
                            </div>
                            <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                                <p class="text-slate-500 text-sm font-medium">Listing Price</p>
                                <p class="text-indigo-600 font-extrabold text-2xl">₹${car.price.toLocaleString('en-IN')}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        fetchCars();
    </script>
</body>
</html>
